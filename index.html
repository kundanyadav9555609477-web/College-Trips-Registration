<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to travel form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🌍 Book Your Collage Trip to USA</h2>
<p>Powered by Spring Boot | Confirm your seat now</p>
        <form action="#" method="post" onsubmit="return handleSubmit(event)">
            <input type="text" name="name" id="name" placeholder="Enter your name">
            <input type="text" name="age" id="age" placeholder="Enter your age">
            <input type="text" name="gender" id="gender" placeholder="Enter your gender">
            <input type="email" name="email" id="email" placeholder="Enter your email">
            <input type="tel" name="phone" id="phone" placeholder="Enter your phone no">
            <input type="text" name="address" id="address" placeholder="Enter your address">
            <textarea name="desc" id="desc" cols="30" rows="5" placeholder="Enter any information here"></textarea>
            <button class="btn" type="submit">Submit</button>
        </form>
    </div>
   
</body>
</html>
